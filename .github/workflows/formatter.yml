name: Code Quality Checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install -r bot/requirements.txt
    - name: Run Ruff Format
      run: ruff format --check bot main.py
    - name: Run Ruff Lint
      run: ruff check bot main.py